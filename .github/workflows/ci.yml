# Every push and every pull request runs the suite.
#
# The tests spawn a real ACP agent over stdio (test/fixtures/fake-agent.js) and
# drive the HTTP server end to end, so this is not a lint pass -- it is the same
# thing that has caught every regression in this repository so far, including a
# missing clearTimeout that held the event loop for the whole request timeout and
# only showed up as "the test file stopped exiting".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about fifteen seconds. This bound is not for slowness, it is
    # for the failure mode that produced it: a test that fails mid-request leaves
    # that request in flight, `server.close()` waits for it, the file never exits,
    # and the job sits silent until somebody notices. That cost twelve minutes and
    # produced a log that simply stopped, with no error anywhere in it.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # `engines` says >=22. Both are tested because the suite uses the node
        # test runner and web streams, and those are exactly the areas where a
        # major bump has bitten before.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the point of a CI run.
      - run: npm ci
      - run: npm test
      - run: make sdk-test
      - run: make check

  # The pinned HINT verifier requires Node 24 even though the shipped runtime is
  # supported (and tested above) on Node 22. Keep the contract gate explicit.
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make spec

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: make python-sdk-test

  # What `npm publish` would actually upload. A `files` list that has drifted --
  # a new src/*.js that nobody added, an example config left behind -- produces a
  # package that works from a checkout and fails from the registry, and that is
  # only visible by looking at the tarball.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install the tarball without optional adapters and start a general config
        run: make pack-install-smoke
