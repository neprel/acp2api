# acp2api -- one OpenAI model id per ACP agent.
#
# Copy, edit, then:  acp2api --config acp2api.yaml --check
#
# ${VAR} and ${VAR:-default} expand from the environment, so nothing secret has to
# be written here.

server:
  host: 127.0.0.1
  port: 10021

  # What CLIENTS of this server send as `Authorization: Bearer ...`.
  # NOT an Anthropic or OpenAI key -- none is ever used. Each agent spends the
  # subscription its own CLI is logged into. Leave empty to disable auth.
  apiKey: ${ACP2API_API_KEY:-}

  # Workspace handed to every ACP session, and the boundary for fs/read_text_file
  # and fs/write_text_file. Relative paths resolve against this file.
  cwd: ./work

  # Nobody is at a keyboard to answer session/request_permission, so it is answered
  # from here: allow | deny. `cwd` above is what actually contains the blast radius.
  permission: allow
  fs: true

  # Narrate what the agent is doing -- its tool calls, its edits, its plan -- so a
  # turn that runs for minutes is legible while it runs: off | reasoning.
  #
  # `reasoning` renders each as a short note in `reasoning_content`, next to the
  # thinking already there. It is never put in the answer: a trace written into the
  # text becomes part of the text, and comes back as the assistant's own words on
  # the next turn.
  #
  #   ▸ plan 1/3 — patch the compose file
  #   › Edit compose.yaml
  #   ± compose.yaml +2/-1
  #   ✗ Bash pytest
  #
  # Off by default so a caller already rendering reasoning as prose does not
  # suddenly start showing tool traffic.
  progress: reasoning

  # Agents can think for a long time. Past this the caller gets 504 rather than a
  # truncated 200 that a router would count as a success.
  requestTimeoutMs: 900000

  # What makes a failure a 429 ("out of quota, try the next brain") instead of a 502
  # ("broken"). ACP has no quota error code, so this pattern list is the whole
  # detection mechanism. Setting it REPLACES the built-in list.
  # limitPatterns: ["rate.?limit", "usage limit", "quota"]

  # OpenAI parameters ACP cannot carry -- temperature, top_p, seed and friends.
  #   warn   (default) accept, drop, log once, and report in `x_acp2api.ignored`
  #   ignore accept and drop silently
  #   error  reject with 400
  # `warn` is the default because every client library sends temperature unasked.
  # Parameters that would change what the ANSWER MEANS (tools, response_format,
  # n > 1) are refused regardless of this setting -- see src/params.js.
  unsupportedParams: warn

  # Retained ACP sessions behind /v1/responses. Each is a live child process holding
  # a login, so both bounds matter: the cap stops a client spawning CLIs without end,
  # and the TTL reaps conversations nobody comes back to. Both close the session.
  maxSessions: 100
  sessionTtlMs: 3600000

  # Reuse the session that already heard the start of an incoming history and send
  # only what is new. The OpenAI API asks every client to be stateless, so without
  # this an agent restarts on every message: it re-reads a growing transcript and
  # loses its working state. A diverging history, or a changed system prompt, still
  # gets a fresh session. Set false for a strictly stateless server.
  continuity: true

  # The header a caller can use to NAME its conversation, instead of leaving
  # acp2api to infer it from the history.
  #
  # Prefix matching only helps callers that resend a growing transcript. A caller
  # that keeps the transcript on its own side -- an agent framework, a chat
  # gateway -- hands over one rolled-up turn per request, so no two requests share
  # a prefix and nothing can ever match. A stable key fixes that, and survives
  # what prefix matching cannot: an edited system prompt, a trimmed history, a
  # compacted transcript.
  #
  # Send any stable string: a thread id, a chat id, a session id. Set "" to ignore
  # the header. Prefix matching stays the fallback either way.
  conversationHeader: x-conversation-id

agents:
  # `name` is the OpenAI model id clients ask for.
  - name: claude-opus
    type: claude # bundled adapter: @agentclientprotocol/claude-agent-acp
    model: opus[1m] # set on the option whose CATEGORY is "model"
    reasoning: high # set on the option whose CATEGORY is "thought_level"

  - name: claude-sonnet
    type: claude
    model: sonnet
    reasoning: medium

  - name: codex
    type: codex # bundled adapter: @agentclientprotocol/codex-acp
    model: gpt-5.6-sol
    reasoning: high

  # Tools are a property of the AGENT, not of the request: an ACP agent runs its own
  # tool loop, so OpenAI's `tools` array has nowhere to go (and is refused with a
  # 400 that says so). MCP servers are how an agent gets tools.
  #
  # `headers` and `env` accept a mapping here and are converted to the
  # [{name, value}] arrays ACP wants. Claude speaks http and sse; Codex, http.
  #
  # - name: claude-with-tools
  #   type: claude
  #   mcpServers:
  #     - name: docs
  #       url: https://mcp.example.com/mcp
  #       headers: { Authorization: "Bearer ${DOCS_TOKEN}" }
  #     - name: local
  #       command: /usr/local/bin/my-mcp
  #       args: [--stdio]

  # Any other ACP-speaking CLI. `command` is required; there is no preset.
  - name: opencode
    type: general
    command: opencode
    args: [acp]
    # `options` addresses a raw config option id, for anything model/reasoning
    # do not cover:
    # options:
    #   mode: bypassPermissions

  - name: cline
    type: general
    command: cline
    args: [--acp]
